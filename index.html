<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymBeam – darčeky zadarmo v košíku (finálne riešenie: web + app)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#FF4100;--brand-d:#E03900;--brand-soft:#FFF1EA;--brand-line:#FFC9B3;--green:#7AB648;--green-d:#689F3A;--ink:#141414;--ink2:#555;--ink3:#8B8B8B;--line:#E3E3E3;--bg:#ECECEE;--warn-bg:#FFF8E1;--warn-line:#EFC24A;--warn-ink:#8A5A00;--ok:#2F9B57;--ok-soft:#EAF6EE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.35}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}

/* toolbar + note */
.tb{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tb .ttl{font-weight:800;margin-right:6px}
.grp{display:flex;align-items:center;gap:6px}
.grp .lbl{font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.reset{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px}
.note{max-width:1172px;margin:14px auto 0;padding:0 16px}
.note .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;font-size:13px;line-height:1.5}
.note h3{margin:0 0 4px;font-size:15px}
.note .k{font-weight:700;font-size:12px;color:var(--ink3);margin-bottom:2px}
.note ul{margin:0;padding-left:16px}
.note .ex{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;color:var(--ink2)}
@media (max-width:900px){.note .box{grid-template-columns:1fr}}
#stage{padding:16px 16px 60px;display:flex;justify-content:center}

/* GymBeam shell (unchanged) */
.desk{width:1140px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mob{width:390px;height:820px;background:#fff;border:10px solid #1c1c1e;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.mob .scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.promo{background:var(--brand);color:#fff;text-align:center;font-size:13px;padding:8px 12px;font-weight:600}
.sh{display:flex;align-items:center;gap:24px;padding:14px 24px}
.logo{font-weight:800;font-style:italic;font-size:24px;letter-spacing:-.5px}
.search{flex:1;max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:var(--ink3);font-size:13px}
.icons{display:flex;gap:14px;align-items:center;font-size:18px}
.icons b{font-size:13px}
.nav{display:flex;gap:26px;padding:4px 24px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.mh .logo{font-size:22px}
.stp{display:flex;align-items:flex-start;justify-content:center;padding:14px 16px 6px}
.stp .s{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px;border:0;background:none;padding:0}
.stp .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#E9E9E9;color:var(--ink3)}
.stp .s.on .c{background:var(--brand);color:#fff}
.stp .s.dn .c{background:var(--ink);color:#fff}
.stp .s span{font-size:12px;color:var(--ink3);font-weight:600}
.stp .s.on span{color:var(--ink)}
.stp .ln{flex:0 0 70px;height:2px;background:#D5D5D5;margin-top:13px}
.dgrid{display:grid;grid-template-columns:1fr 330px;gap:22px;padding:18px 24px 28px;align-items:start}
.h1row{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.h1row h1{font-size:20px;margin:0}
.h1row span{font-size:13px;color:var(--ink2)}
.mob .h1row{padding:0 16px}
.mob .pad{padding:0 16px}
.card{border:1px solid var(--line);border-radius:6px;background:#fff}
.pl{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line);position:relative}
.pl:last-child{border-bottom:0}
.th{border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.pl-b{flex:1;min-width:0}
.pl-n{font-weight:700;font-size:13.5px;padding-right:22px}
.pl-m{font-size:12px;color:var(--ink2);margin-top:3px}
.pl-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:6px;height:32px}
.qty b{width:30px;text-align:center;font-weight:500}
.qty i{width:30px;text-align:center;font-style:normal;font-size:18px}
.price{color:var(--brand);font-weight:800;font-size:16px;text-align:right}
.price s{display:block;color:var(--ink3);font-weight:500;font-size:12px}
.x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:16px}
.sum{border:1px solid var(--line);border-radius:6px;padding:14px;background:#fff}
.sum h3{margin:0 0 12px;font-size:15px}
.loy{border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-weight:700;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between}
.mob .loy{margin:12px 16px}
.shipbar{background:#F3F3F3;border-radius:6px;padding:10px 12px;font-size:13px;font-weight:600}
.shipbar i{display:block;height:4px;background:#66BB6A;border-radius:3px;margin-top:8px}
.mob .shipbar{margin:8px 16px 12px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink2)}
.row b{color:var(--ink)}
.row.disc b{color:var(--ok)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:6px}
.tot b{font-size:16px}
.tot span{color:var(--brand);font-weight:800;font-size:19px}
.vat{text-align:right;font-size:11px;color:var(--ink3);margin-bottom:12px}
.cta{width:100%;border:0;background:var(--green);color:#fff;font-weight:800;font-size:14px;padding:14px;border-radius:4px}
.cta:hover{background:var(--green-d)}
.code{margin:12px 0}
.code-h{font-size:13px;font-weight:600;margin-bottom:6px}
.code-r{display:flex}
.code-r input{flex:1;min-width:0;border:1px solid #CFCFCF;border-right:0;border-radius:4px 0 0 4px;padding:9px 10px;font-size:13px}
.code-r button{border:0;background:#FFB49A;color:#fff;font-weight:700;padding:0 14px;border-radius:0 4px 4px 0}
.code-r button:hover{background:var(--brand)}
.code-ok{display:flex;justify-content:space-between;align-items:center;background:var(--ok-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.code-ok b{color:var(--ok)}
.code-msg{font-size:12.5px;margin-top:6px;line-height:1.4}
.code-msg.err{color:var(--brand-d)}
.mob .code{margin:18px 16px}
.yel{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--warn-ink);margin:10px 0;line-height:1.45}
.yel button{color:var(--warn-ink);font-weight:700;text-decoration:underline;background:none;border:0;padding:0}
.mob .yel{margin:10px 16px}
.sec h2{font-size:18px;margin:6px 0 12px}
.mob .sec{padding:0 16px}
.radio{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;width:100%;background:#fff;text-align:left}
.radio.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio .rd{width:18px;height:18px;border-radius:50%;border:2px solid #BDBDBD;flex-shrink:0}
.radio.on .rd{border:5px solid var(--ink)}
.radio .rb{flex:1}
.radio .rb b{display:block;font-size:13.5px}
.radio .rb span{font-size:12px;color:var(--ink2)}
.radio .rp{font-weight:700;font-size:13px}
.back{border:0;background:none;padding:0;font-size:13px;color:var(--ink2);text-decoration:underline;margin-top:10px}
.msum{margin:16px;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.li-s{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.li-s span{flex:1;min-width:0}
.li-s small{display:block;color:var(--ink3);font-size:11px}
.sbar{border-top:1px solid var(--line);background:#fff;padding:10px 14px 14px;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.sbar-r{display:flex;align-items:center;gap:12px}
.sbar-t{flex-shrink:0}
.sbar-t small{display:block;font-size:11px;color:var(--ink3)}
.sbar-t b{color:var(--brand);font-size:17px}
.sbar .cta{padding:13px}
.guard{font-size:12.5px;background:#FFF4EF;border:1px solid var(--brand-line);color:#7A2B0A;border-radius:6px;padding:9px 11px;margin-bottom:10px;line-height:1.45}
.gstat{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border-radius:6px;padding:9px 11px;font-size:12.5px;font-weight:700;margin-bottom:10px;border:1px solid transparent;background:none}
.gstat.warn{background:var(--brand-soft);color:var(--brand-d);border-color:var(--brand-line)}
.gstat.ok{background:var(--ok-soft);color:var(--ok)}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.link.mute{color:var(--ink3);font-weight:500}
.link.dark{color:var(--ink)}
.free{color:var(--green);font-weight:800}
.tag{display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:800;border-radius:3px;padding:2px 5px;vertical-align:middle;margin-left:6px}

/* shared gift atoms */
.pill{border:1.5px solid #CFCFCF;background:#fff;border-radius:6px;min-width:36px;padding:5px 8px;font-size:12.5px;font-weight:700}
.pill.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills.need .pill{border-color:var(--brand)}
.mob .pill{min-width:32px;padding:5px 6px}
.needtxt{font-size:11.5px;font-weight:700;color:var(--brand-d)}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.bgrid.c4{grid-template-columns:repeat(4,1fr)}
.mob .bgrid{grid-template-columns:repeat(2,1fr)}
.bo{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,opacity .15s}
.bo:hover{border-color:#BDBDBD}
.bo .img{aspect-ratio:1/1;border-radius:8px;display:grid;place-items:center;font-size:44px}
.bo .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.bo .rad{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;border:2px solid #C9C9C9;background:#fff;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.bo .rad.chk{border-radius:6px}
.bo.on{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.bo.on .rad{background:var(--ok);border-color:var(--ok)}
.bo.dim{opacity:.45}
.bo.off{opacity:.6}
.bo.lock{cursor:default;opacity:.55}
.decnote{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F4F4F4;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.fullnote{background:var(--brand-soft);color:var(--brand-d);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.cnt{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px;background:var(--brand-soft);color:var(--brand-d);margin-left:6px;vertical-align:1px}
.cnt.ok{background:var(--ok-soft);color:var(--ok)}

/* ===== VARIANT A · SLOTY ===== */
.n1{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;padding:16px}
.mob .n1{margin:0 16px 16px;padding:14px}
.n1-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.n1-h h2{margin:0;font-size:18px}
.n1-h span{font-size:13px;font-weight:700;white-space:nowrap}
.n1-sub{font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.groups{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:flex-start}
.mob .groups{gap:14px 12px}
.sgrp{border-radius:12px;padding:6px;margin:-6px;transition:background .15s}
.sgrp.active{background:#F4F4F4}
.sgrp-h{font-size:12px;font-weight:800;margin:0 2px 6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sgrp-h span{font-weight:700;color:var(--ink3)}
.sgrp-t{display:flex;gap:10px}
.mob .sgrp-t{gap:8px}
.slot{width:112px;position:relative;text-align:center}
.mob .slot{width:94px}
.slot .tile{width:100%;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;font-size:48px;position:relative;border:2px solid transparent;padding:0;background:#F6F6F6}
.mob .slot .tile{font-size:38px}
.slot.empty .tile{border:2px dashed var(--brand);background:var(--brand-soft);color:var(--brand)}
.slot.empty .tile .plus{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:28px;font-weight:300;line-height:1}
.slot.empty .tile .plus b{font-size:12px;font-weight:800}
.slot.locked .tile{background:#F4F4F4;border:2px solid #EBEBEB;color:#B5B5B5;font-size:24px}
.slot.declined .tile{background:#F7F7F7;border:2px dashed #D6D6D6;color:#A8A8A8;font-size:11.5px;font-weight:700;line-height:1.3}
.sgrp.active .slot .tile{box-shadow:0 0 0 2px var(--ink)}
.sgrp.active .slot.empty .tile{box-shadow:none}
.slot .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;padding:0 5px;pointer-events:none}
.slot .badge.new{background:var(--brand)}
.slot .badge.auto{background:var(--ink);font-size:9.5px}
.slot .rmv{position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid #CFCFCF;font-size:13px;line-height:1;display:grid;place-items:center;padding:0;color:var(--ink2)}
.slot .rmv:hover{border-color:var(--ink);color:var(--ink)}
.slot .nm{font-size:11.5px;color:var(--ink2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.slot.empty .nm{color:var(--brand-d);font-weight:700}
.slot .lk{height:4px;background:#E6E6E6;border-radius:3px;margin:6px 8px 0;overflow:hidden}
.slot .lk i{display:block;height:100%;background:var(--brand)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,65,0,.35)}70%{box-shadow:0 0 0 10px rgba(255,65,0,0)}100%{box-shadow:0 0 0 0 rgba(255,65,0,0)}}
.sgrp:not(.active) .slot.empty .tile{animation:pulse 2s infinite}
.spanel{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.spanel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.spanel-h b{font-size:15px}
.spanel-h small{display:block;font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:2px}
.spanel-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.spanel-f .st{font-size:12px;color:var(--ink3)}

/* checkout strip */
.cs{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cs-h{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:8px}
.cs-h span{font-weight:600;color:var(--ink2);font-size:12px}
.cs-row{display:flex;gap:6px;flex-wrap:wrap}
.cs-row .em{border:2px dashed var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:800}
.cs-p{margin-top:10px;border:1px solid var(--brand-line);background:#FFFCFA;border-radius:8px;padding:10px 12px}
.cs-p.dec{border-color:var(--line);background:#F8F8F8}
.cs-p b{font-size:13px}
.cs-p .r{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.mob .cs-p{margin:10px 16px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid #E2E2E2;display:grid;place-items:center;font-size:20px;padding:0;position:relative}
.sw.on{border-color:var(--ink)}
.sw.on::after{content:'✓';position:absolute;bottom:-3px;right:-3px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.sw.dim{opacity:.4}
.done{padding:30px 24px;max-width:620px;margin:0 auto}
.done .lst{border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin:14px 0}
.done .li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F1F1F1;font-size:13px}
.done .li:last-child{border-bottom:0}
.done .li span{flex:1}
.done .miss{color:var(--brand-d);font-weight:600}


/* Variant A mobile: accordion, výber sa otvorí pod políčkom */
.mgroups{display:flex;flex-direction:column;gap:10px}
.mg{border:1px solid var(--line);border-radius:12px;background:#fff;scroll-margin-top:12px;transition:border-color .15s}
.mg.is-p{border-color:var(--brand-line);background:#FFFCFA}
.mg.active{border:1.5px solid var(--ink);background:#fff}
.g1-row{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.g1-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g1-t b{font-size:13.5px}
.g1-t span{font-size:12.5px}
.gs-need{color:var(--brand-d);font-weight:700}
.gs-ok{color:var(--ink2)}
.gs-mute{color:var(--ink3)}
.chev{color:var(--ink3);font-size:14px;transition:transform .2s}
.mg.active .chev{transform:rotate(180deg)}
.mg .g1-tiles{display:flex;gap:8px}
.mg.multi .g1-tiles{padding:0 12px 12px}
.mob .mg .slot{width:64px}
.mob .mg.multi .slot{width:92px}
.mob .mg .slot .tile{font-size:30px;border-radius:10px}
.mob .mg.multi .slot .tile{font-size:38px}
.mob .mg .slot .nm{display:none}
.mob .mg.multi .slot .nm{display:-webkit-box;min-height:0}
.mob .mg .slot.empty .tile .plus{font-size:22px}
.mob .mg .slot.empty .tile .plus b{font-size:10.5px}
.mob .mg .slot.declined .tile{font-size:10px}
.mob .mg .slot .rmv{width:22px;height:22px;top:-6px;left:-6px}
.mob .mg .slot .badge{top:-6px;right:-6px}
.mob .mg .slot .badge.auto{font-size:8.5px;min-width:0;padding:0 4px}
.mg.active .slot .tile{box-shadow:none}
.mg .spanel{margin:0 12px;padding:12px 0 14px;border-top:1px solid var(--line)}
.mg .spanel-h b{font-size:14px}
.mg .bgrid{gap:8px}
.mg .bo{padding:8px}
.mg .bo .img{font-size:36px}
.mg .bo .rad{top:13px;right:13px;width:22px;height:22px}
.lk2{height:4px;background:#E6E6E6;border-radius:3px;margin-top:4px;overflow:hidden;width:120px}
.lk2 i{display:block;height:100%;background:var(--brand)}
.mg:not(.active) .slot.empty .tile{animation:pulse 2s infinite}


/* =================== APP (React Native look) =================== */
.aph{width:390px;height:844px;background:#fff;border:10px solid #1c1c1e;border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;flex-shrink:0;--a:#EB542C;--a-d:#D4441F;--a-soft:#FFF2ED;--a-line:#FFCDBD;--pill:#F2F3F5;--aline:#ECECEC}
.ast{display:flex;justify-content:space-between;padding:14px 30px 0;font-weight:700;font-size:15px;flex-shrink:0}
.atitle{text-align:center;font-weight:700;font-size:18px;padding:10px 0 12px;flex-shrink:0;position:relative}

  perprod:{label:'2× produkt + tričko', prods:[['jw',2],['whey',1]], rules:['jw','tier'], txt:'2× Just Whey = 2 extra darčeky, môžu byť aj rovnaké. Tričko sa pridá až po výbere veľkosti aj farby. Skúste kliknúť mimo veľkostí. Zmeňte počet Just Whey a sledujte políčka.'}
};
const SHIP = {box:{n:'GymBeam Box',d:'Výdajný box, doručenie 1–2 dni',c:0}, packeta:{n:'Packeta výdajné miesto',d:'Doručenie 2–3 dni',c:0}, dpd:{n:'Kuriér DPD',d:'Doručenie domov 1–2 dni',c:3.9}};
const PAY = {card:{n:'Platba kartou online',d:'Visa, Mastercard',c:0}, apple:{n:'Apple Pay / Google Pay',d:'Rýchla platba v telefóne',c:0}, cod:{n:'Dobierka',d:'Platba pri prevzatí',c:1.5}};

let S = {platform:'web', view:'desktop', scen:'multi', step:'cart'};
function initSel(id){ const r = RULE[id]; S.sel[id] = r.mode === 'auto' ? r.opts.map(sku => ({sku})) : r.mode === 'preselect' ? r.def.map(sku => ({sku})) : []; }
function resetFlow(){

/* ---------- model ---------- */
const prods = () => SCEN[S.scen].prods.map(([id,q]) => ({id, ...PROD[id], qty:S.pq[id] || q}));
const rules = () => SCEN[S.scen].rules.concat(S.code ? ['code'] : []).map(id => RULE[id]).sort((a,b) => a.ord - b.ord);
const rq = r => r.qtyPer ? ((prods().find(p => p.id === r.qtyPer) || {qty:1}).qty) : r.qty;
const picks = r => S.sel[r.id] || [];
const hasVars = k => !!(OPT[k].sizes || OPT[k].colors);
const complete = p => { const o = OPT[p.sku]; return !(o.sizes && !p.size) && !(o.colors && !p.color); };
const pending = r => !S.dec[r.id] && picks(r).length < rq(r);
const missing = r => S.dec[r.id] ? 0 : Math.max(0, rq(r) - picks(r).length);
const pendList = () => rules().filter(pending);
const toGet = () => rules().reduce((a, r) => a + missing(r), 0);
const giftTotal = () => rules().reduce((a, r) => a + picks(r).length, 0);
const giftQty = r => r.qtyFrom ? (prods().find(p => p.id === r.qtyFrom) || {qty:1}).qty : 1;
const isMob = () => S.view === 'mobile';
const vtxt = p => { const o = OPT[p.sku]; const c = o.colors && p.color ? o.colors.find(x => x.id === p.color).n : ''; return [p.size, c].filter(Boolean).map(x => ', ' + x).join(''); };

/* generické názvy: FE pozná len prah */
function label(r){
  return r.thr ? `Nad ${r.thr} €` : 'Extra darček';
}
function title(r){
  return r.thr ? `Darček za nákup nad ${r.thr} €` : 'Extra darček zadarmo';
}
function reason(r){
  const q = rq(r), n = r.opts.length;
  if (r.mode === 'auto') return picks(r).length ? 'Darček je už váš. Nechcete ho? Odoberte ho krížikom.' : 'Kliknite na darček a je váš.';
  if (r.mode === 'preselect') return 'Jeden sme vám už pribalili. Chuť na iný? Kliknite naň a vymeníme ho.';
  if (r.same) return `Získate až ${q} ${darcek(q)}. Pokojne aj ${q > 1 ? 'rovnaké' : 'rovnaký'}, alebo každý iný.`;
  if (q > 1) return `Vyberte si ${q} z ${n}. Kombinujte podľa chuti.`;
  if (n === 1 && hasVars(r.opts[0])) return 'Stačí vybrať veľkosť a darček je váš.';
  return `Vyberte si 1 z ${n} darčekov. Ten, ktorý vám sadne najviac.`;
}

function totals(){
  const ps = prods(); const sub = ps.reduce((a,p) => a + p.qty*p.unit, 0);
  const disc = S.code ? ps.filter(p => p.pink).reduce((a,p) => a + p.qty*p.unit*.2, 0) : 0;
  const ship = S.step === 'cart' ? 0 : SHIP[S.ship].c, pay = (S.step === 'pay' || S.step === 'done') ? PAY[S.pay].c : 0;
  return {sub, disc, ship, pay, total:sub - disc + ship + pay};
}

/* ---------- akcie ---------- */
function advance(rid){                       // po doplnení pravidla: zavri a otvor ďalšie v poradí
  if (S.newSlot === rid) S.newSlot = null;
  const rs = rules(), i = rs.findIndex(x => x.id === rid);
  const nx = rs.slice(i + 1).find(pending) || rs.slice(0, Math.max(0, i)).find(pending);
  S.active = nx ? nx.id : '';
  if (S.platform === 'app' && S.sheet) S.sheetTab = nx ? nx.id : rid;
  if (nx && S.platform === 'web' && isMob()) S.scrollTo = nx.id;
  if (!pendList().length) S.guard = false;
}
function doPick(rid, k, size, color){
  const r = RULE[rid], q = rq(r); let arr = picks(r).slice();
  const i = arr.findIndex(p => p.sku === k); S.full = null; S.hint = null;
  if (!r.same && i >= 0 && !hasVars(k)) { arr.splice(i, 1); }   // klik na vybraný = vymeniť
  else if (arr.length < q) arr.push({sku:k, size:size || null, color:color || null});
  else if (q === 1) arr = [{sku:k, size:size || null, color:color || null}];
  else { S.full = rid; return; }
  S.sel[rid] = arr; delete S.dec[rid]; S.pop = rid + k;
  if (!pending(r)) advance(rid);
}
function cardClick(rid, k){
  const r = RULE[rid];
  if (hasVars(k)) { S.hint = rid + '|' + k; S.full = null; return; }   // bez veľkosti nepridávame, len zvýrazníme
  doPick(rid, k);
}
function doDraft(rid, k, f, v){
  const key = rid + '|' + k, o = OPT[k], d = {...(S.draft[key] || {}), [f]:v};
  if ((!o.sizes || d.size) && (!o.colors || d.color)) { delete S.draft[key]; S.lastG = rid + '|' + k + '#' + (d.size || '') + '|' + (d.color || ''); doPick(rid, k, d.size, d.color); }
  else { S.draft[key] = d; S.hint = null; }
}
function doVar(rid, i, f, v){ const arr = picks(RULE[rid]).map(p => ({...p})); if (arr[i]) { arr[i][f] = v; S.sel[rid] = arr; S.pop = rid + arr[i].sku; } }
function doRemoveIdx(rid, i){ const arr = picks(RULE[rid]).slice(); arr.splice(i, 1); S.sel[rid] = arr; S.full = null; }
function doUnpick(rid, k){ const arr = picks(RULE[rid]).slice(); const i = arr.map(p => p.sku).lastIndexOf(k); if (i >= 0) arr.splice(i, 1); S.sel[rid] = arr; S.full = null; }
function doRemove(rid, k){                   // × na políčku = tento kus nechcem
  doUnpick(rid, k); delete S.dec[rid]; S.pop = null;
}
function doDecline(rid){ S.dec[rid] = true; S.full = null; S.hint = null; if (!pendList().length) S.guard = false; }
function doUndo(rid){ const r = RULE[rid]; delete S.dec[rid]; if (!picks(r).length && r.mode !== 'pick') { initSel(rid); S.pop = rid + r.opts[0]; if (!pending(r) && S.active === rid) S.active = ''; } else if (S.platform === 'web') S.active = rid; }
function doQty(id, d){
  const cur = prods().find(p => p.id === id).qty, nq = Math.max(1, Math.min(12, cur + d)); S.pq[id] = nq;
  rules().filter(r => r.qtyPer === id).forEach(r => { if (picks(r).length > nq) S.sel[r.id] = picks(r).slice(0, nq); if (d > 0) delete S.dec[r.id]; S.pop = r.id; });
}
function activeSlot(){ if (S.active !== null) return S.active; const p = pendList()[0]; return p ? p.id : ''; }
function focusPending(id){ const p = id ? RULE[id] : pendList()[0]; if (!p) return; S.active = p.id; S.scrollTo = p.id; }

/* ---------- atómy ---------- */
const thumb = (o, s, cls='') => `<div class="th ${cls}" style="background:${o.bg};width:${s}px;height:${s}px;font-size:${Math.round(s*.52)}px" aria-hidden="true">${o.e}</div>`;
function varPickers(o, cur, at){            // pills veľkosti + farebné bodky
  const sz = o.sizes ? `<div class="pills">${o.sizes.map(z => `<button class="pill ${cur.size === z ? 'on' : ''}" ${at('size', z)}>${z}</button>`).join('')}</div>` : '';
  const cl = o.colors ? `<div class="cdots">${o.colors.map(c => `<button class="cdot ${cur.color === c.id ? 'on' : ''}" style="background:${c.hex}" title="${c.n}" aria-label="${c.n}" ${at('color', c.id)}></button>`).join('')}${cur.color ? `<span class="cname">${o.colors.find(c => c.id === cur.color).n}</span>` : ''}</div>` : '';
  return sz + cl;
}
function varBlock(r, k){
  const o = OPT[k]; if (!hasVars(k)) return '';
  const ps = picks(r), idx = ps.map((p, i) => p.sku === k ? i : -1).filter(i => i >= 0), q = rq(r);
  const rows = idx.map((i, n) => `<div class="vrow"><div class="prow"><span>${idx.length > 1 || r.same ? `${n + 1}. kus` : 'Vaša voľba'}</span><button class="link mute" data-act="rmidx" data-r="${r.id}" data-i="${i}">Odobrať</button></div>
    ${varPickers(o, ps[i], (f, v) => `data-act="pvar" data-r="${r.id}" data-i="${i}" data-f="${f}" data-v="${v}"`)}</div>`).join('');
  const canAdd = r.same ? ps.length < q : !idx.length && (ps.length < q || q === 1);
  if (!canAdd || S.dec[r.id] && !r.same) return rows;
  const key = r.id + '|' + k, d = S.draft[key] || {};
  const need = [o.sizes && !d.size ? 'veľkosť' : '', o.colors && !d.color ? 'farbu' : ''].filter(Boolean);
  return rows + `<div class="vrow draft ${S.hint === key ? 'hint' : ''}">${idx.length ? '<div class="prow"><span>Ďalší kus</span></div>' : ''}
    ${varPickers(o, d, (f, v) => `data-act="dvar" data-r="${r.id}" data-k="${k}" data-f="${f}" data-v="${v}"`)}
    <div class="dtxt">${S.hint === key ? `Najprv vyberte ${need.join(' a ')}. Potom je darček váš.` : `Vyberte ${need.join(' a ')} a darček je váš.`}</div></div>`;
}
function bulkBlock(r, k){              // kompaktný výber pre veľa kusov: 1 skladač + čipy
  const o = OPT[k], ps = picks(r), q = rq(r), key = r.id + '|' + k, groups = {}, order = [];
  ps.forEach(p => { if (p.sku !== k) return; const g = (p.size || '') + '|' + (p.color || ''); if (!groups[g]) { groups[g] = {p, n:0}; order.push(g); } groups[g].n++; });
  const total = order.reduce((a, g) => a + groups[g].n, 0), ed = S.edit && S.edit.key === key && groups[S.edit.g] ? S.edit.g : null;
  const room = q - ps.length + (ed ? groups[ed].n : 0);
  const cname = id => o.colors && id ? o.colors.find(c => c.id === id) : null;
  const chips = order.map(g => { const {p, n} = groups[g], c = cname(p.color);
    return `<span class="vchip ${ed === g ? 'edit' : ''}"><button class="vchip-b" data-act="gedit" data-r="${r.id}" data-k="${k}" data-g="${g}" title="Upraviť">${n}× ${p.size || ''}${c ? `<i class="dot" style="background:${c.hex}"></i>${c.n}` : ''}</button><button class="vchip-x" data-act="gdel" data-r="${r.id}" data-k="${k}" data-g="${g}" aria-label="Odobrať">×</button></span>`; }).join('');
  let comp = '';
  if (room > 0) {
    const c = S.comp[key] || {}, n = Math.max(1, Math.min(c.n || room, room));
    const need = [o.sizes && !c.size ? 'veľkosť' : '', o.colors && !c.color ? 'farbu' : ''].filter(Boolean), ready = !need.length;
    const at = (act, extra = '') => `data-act="${act}" data-r="${r.id}" data-k="${k}" ${extra}`;
    comp = `<div class="vcomp ${S.hint === key ? 'hint' : ''}">${ed ? '<div class="prow"><span>Upravujete výber</span><button class="link mute" data-act="gcancel">Zrušiť</button></div>' : total ? '<div class="prow"><span>Pridať ďalšie</span></div>' : ''}
      ${varPickers(o, c, (f, v) => at('cvar', `data-f="${f}" data-v="${v}"`))}
      <div class="vrow2"><div class="stp2 sm"><button ${at('cqty', 'data-d="-1"')} ${n <= 1 ? 'disabled' : ''} aria-label="Menej">−</button><b>${n}×</b><button ${at('cqty', 'data-d="1"')} ${n >= room ? 'disabled' : ''} aria-label="Viac">+</button></div>
      <button class="vadd" ${at('cadd')} ${ready ? '' : 'disabled'}>${ready ? (ed ? `Uložiť ${n}×` : `Pridať ${n}× do košíka`) : `Vyberte ${need.join(' a ')}`}</button></div>
      ${S.hint === key ? `<div class="dtxt" style="color:var(--brand-d)">Najprv vyberte ${need.join(' a ')}. Potom je darček váš.</div>` : ''}</div>`;
  }
  return `<div class="bhead"><b>${total} z ${q} ks</b><span>${q - ps.length ? `zostáva ${q - ps.length}` : '✓ všetky kusy vybraté'}</span></div>${chips ? `<div class="vchips">${chips}</div>` : ''}${comp}`;

function compOp(rid, k, op, a){
  const r = RULE[rid], key = rid + '|' + k, c = {...(S.comp[key] || {})};
  if (op === 'var') { c[a.dataset.f] = a.dataset.v; S.hint = null; }
  if (op === 'qty') { const ps = picks(r), q = rq(r); const room = q - ps.length + (S.edit && S.edit.key === key ? ps.filter(p => p.sku === k && (p.size||'') + '|' + (p.color||'') === S.edit.g).length : 0); c.n = Math.max(1, Math.min(room, (c.n || room) + +a.dataset.d)); }
  if (op === 'add') {
    let arr = picks(r).slice();
    if (S.edit && S.edit.key === key) arr = arr.filter(p => !(p.sku === k && (p.size||'') + '|' + (p.color||'') === S.edit.g));
    const room = rq(r) - arr.length, n = Math.max(1, Math.min(c.n || room, room));
    for (let i = 0; i < n; i++) arr.push({sku:k, size:c.size || null, color:c.color || null});
    S.sel[rid] = arr; delete S.dec[rid]; delete S.comp[key]; S.edit = null; S.pop = rid + k;

function groupOp(rid, k, g, op, f, v){

  const match = p => p.sku === k && (p.size || '') === size && (p.color || '') === color;
  if (op === 'plus' && arr.length < q) arr.push({sku:k, size:size || null, color:color || null});
  if (op === 'fill') while (arr.length < q) arr.push({sku:k, size:size || null, color:color || null});
  if (op === 'minus') { const i = arr.map(match).lastIndexOf(true); if (i >= 0) arr.splice(i, 1); }
  if (op === 'var') { arr = arr.map(p => match(p) ? {...p, [f]:v} : p); g = f === 'size' ? v + '|' + color : size + '|' + v; }
  S.sel[rid] = arr; delete S.dec[rid]; S.lastG = rid + '|' + k + '#' + g; S.pop = rid + k;
  if ((op === 'plus' || op === 'fill') && !pending(r)) advance(rid);
}
const sameCount = (r, k) => picks(r).filter(p => p.sku === k).length;
const stepperHTML = (r, k) => { const n = sameCount(r, k); return n && !hasVars(k) ? `<div class="stp2"><button data-act="unpick" data-r="${r.id}" data-k="${k}" aria-label="Menej">−</button><b>${n}×</b><button data-act="card" data-r="${r.id}" data-k="${k}" aria-label="Viac">+</button></div>` : ''; };
function countBadge(r){ const q = rq(r); if (q < 2) return ''; const n = picks(r).length; return `<span class="cnt ${n >= q ? 'ok' : ''}">${n} z ${q}</span>`; }
const fullNote = r => S.full === r.id ? `<div class="fullnote">Máte vybraté ${rq(r)} z ${rq(r)}. Chcete iný? Najprv jeden odznačte.</div>` : '';
function footLeft(r){
  if (S.dec[r.id]) return '<span></span>';
  const has = picks(r).length;
  return '<span></span>';
}
function footRight(r){
  if (S.dec[r.id]) return `<span class="st">Kliknite na darček a je váš</span>`;
  const m = missing(r);
  if (!m) return `<span class="free" style="font-size:13px">✓ Darček je váš</span>`;
  return `<span class="st">${rq(r) > 1 ? `Vyberte ešte ${m}` : r.opts.every(hasVars) ? 'Vyberte variant a darček je váš' : 'Kliknite na darček, ktorý chcete'}</span>`;
}
function optionCards(r, grid, cardCls){

/* ===== WEB · SLOTY ===== */
function slotsFor(r){
  const ps = picks(r), out = [];
  if (rq(r) > 4) {                                   // veľa kusov: 1 políčko s počtom + 1 prázdne
    const n = ps.length, m = missing(r);
    if (n) { const o = OPT[ps[0].sku]; out.push(`<div class="slot full ${S.pop && S.pop.startsWith(r.id) ? 'pop' : ''}"><button class="tile" style="background:${o.bg}" data-act="slot" data-r="${r.id}" aria-label="${n} darčekov">${o.e}<span class="badge">${n}×</span></button><div class="nm">${n} ${darcek(n)} vo vašom košíku</div></div>`); }

      out.push(`<div class="slot full ${S.pop === r.id + p.sku ? 'pop' : ''}"><button class="tile" style="background:${o.bg}" data-act="slot" data-r="${r.id}" aria-label="${o.name}">${o.e}${badge}</button>
        <button class="rmv" data-act="remove" data-r="${r.id}" data-k="${p.sku}" aria-label="Odobrať ${o.name}">×</button><div class="nm">${o.short}${vtxt(p)}</div></div>`);
    } else if (S.dec[r.id]) out.push(`<div class="slot declined"><button class="tile" data-act="slot" data-r="${r.id}">Bez<br>darčeka</button><div class="nm">Zmeniť názor?</div></div>`);
    else out.push(`<div class="slot empty"><button class="tile" data-act="slot" data-r="${r.id}" aria-label="Získať darček"><span class="plus">+<b>Získať</b></span>${S.newSlot === r.id && i === ps.length ? '<span class="badge new">NOVÉ</span>' : ''}</button><div class="nm">Čaká na vás</div></div>`);
  }

}
function panelA(rid){

    for (let i = 0; i < rq(r); i++) { const p = ps[i];

        tiles.push(`<div class="atw ${S.pop === r.id + p.sku ? 'pop' : ''}"><button class="at" style="background:${o.bg}" data-act="asheet" data-r="${r.id}" aria-label="${o.name}">${o.e}<span class="bd">✓</span></button><button class="atx" data-act="remove" data-r="${r.id}" data-k="${p.sku}" aria-label="Odobrať">×</button></div>`);

const NOTE = {
  web:{name:'Web · Darčekové sloty (finálne riešenie)',
    idea:'Sekcia <b>„Vaše darčeky zadarmo“</b> je nad produktmi a zobrazí sa len vtedy, keď má zákazník na darček nárok. Každý darček je jedno políčko. Prázdne políčko neustále pulzuje a ťahá pozornosť. Klik otvorí výber, po pridaní sa výber zavrie a otvorí sa ďalšie pravidlo v poradí. Pokladňa ostáva ako dnes so žltou hláškou.',
    why:['Počet políčok = počet darčekov, netreba nič čítať','Pulzujúce prázdne políčko sa nedá prehliadnuť','Postupný výber zľava doprava, bez skákania','Darček s veľkosťou sa pridá až po výbere variantu, nič sa nepridá omylom','Aj automaticky pribalený darček sa odoberá krížikom a vracia kliknutím na kartičku, rovnako ako ostatné'],
    dev:['Názvy skupín: pravidlo s prahom „Nad X €“, ostatné „Extra darček“','Políčko = 1 kus z applied rule (qty, pri darčeku k produktu = počet kusov)','× = nechcem (už nepripomínať), klik v paneli = vymeniť','Bez nároku sa sekcia nerenderuje']},
  app:{name:'App · Karta darčekov + opravený bottom sheet',
    idea:'Karta <b>„Vaše darčeky zadarmo“</b> pod pásmi s rovnakými políčkami ako web. Ťuknutie otvorí bottom sheet s <b>tabmi</b> namiesto skrytých stránok do strany, so scrollom len v obsahu a pevnou pätičkou. Nad DO POKLADNE je pripomienka „Získajte ešte X darčekov“. Pokladňa ostáva so žltou hláškou.',
    why:['Taby so stavom ukážu všetky výbery naraz (dnes ich skrývajú bodky)','Žiadny konflikt gest: sheet sa scrolluje len zvisle','Po výbere sa sheet sám prepne na ďalší tab v poradí','Pripomienka je pri palci, tam kde sa rozhoduje'],
    dev:['Sheet: header a taby fixné, ScrollView len pre mriežku','DO POKLADNE pri chýbajúcom darčeku raz otvorí sheet, potom pustí ďalej','Rovnaké generické názvy ako web']}
};
const GROUPS = [['Zobrazenie','view',[['desktop','Desktop'],['mobile','Mobil']],'web'],['Scenár','scen',Object.entries(SCEN).map(([k,v]) => [k, v.label])],['Krok','step',[['cart','Košík'],['ship','Doručenie'],['pay','Platba']],'web']];
const toolbar = () => `<span class="ttl">Darčeky v košíku</span><div class="grp"><span class="lbl">Platforma</span><div class="seg">${[['web','Web'],['app','App']].map(([v,t]) => `<button class="${S.platform === v ? 'on' : ''}" data-tb="platform" data-v="${v}">${t}</button>`).join('')}</div></div>
  ${GROUPS.filter(g => !g[3] || g[3] === S.platform).map(([l,k,o]) => `<div class="grp"><span class="lbl">${l}</span><div class="seg">${o.map(([v,t]) => `<button class="${S[k] === v ? 'on' : ''}" data-tb="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')}<button class="reset" data-act="restart">Reset</button>`;
function note(){
  const c = NOTE[S.platform];
  return `<div class="box"><div><h3>${c.name}</h3>${c.idea}</div><div><div class="k">Prečo je to pre zákazníka dobré</div><ul>${c.why.map(x => `<li>${x}</li>`).join('')}</ul></div><div><div class="k">Pre dev</div><ul>${c.dev.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div class="ex"><b>Scenár „${SCEN[S.scen].label}“:</b> ${SCEN[S.scen].txt}</div></div>`;
}

/* ===== render ===== */
function render(){
  document.getElementById('tb').innerHTML = toolbar();
  document.getElementById('note').innerHTML = note();
  const sc = document.getElementById('mscroll') || document.getElementById('ascroll'), keep = sc && !S.noKeep ? sc.scrollTop : 0; S.noKeep = false;
  const ab = document.getElementById('abody'), keepB = ab && S.sameTab ? ab.scrollTop : 0;
  const at = document.getElementById('atabs'), keepT = at ? at.scrollLeft : 0;
  document.getElementById('stage').innerHTML = S.platform === 'app' ? appScreen() : (isMob() ? mobile() : desktop());
  const sc2 = document.getElementById('mscroll') || document.getElementById('ascroll');
  if (sc2 && !S.scrollTo) { sc2.style.scrollBehavior = 'auto'; sc2.scrollTop = keep; sc2.style.scrollBehavior = ''; }
  const ab2 = document.getElementById('abody'); if (ab2) ab2.scrollTop = keepB;
  const at2 = document.getElementById('atabs'); if (at2) { at2.scrollLeft = keepT; const on = at2.querySelector('.atb.on'); if (on && (on.offsetLeft < at2.scrollLeft || on.offsetLeft + on.offsetWidth > at2.scrollLeft + at2.clientWidth)) at2.scrollLeft = on.offsetLeft - 20; }
  if (S.scrollTo) { const el = document.getElementById('g-' + S.scrollTo) || document.getElementById('gifts'); if (el) el.scrollIntoView({block:isMob() && S.platform === 'web' ? 'start' : 'center', behavior:'smooth'}); S.scrollTo = null; }
  S.sheetIn = false; S.sameTab = true; S.pop = null;
}
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tb]');
  if (tb) { const k = tb.dataset.tb, v = tb.dataset.v; if (k !== 'view' && k !== 'step') { S[k] = v; resetFlow(); } else { S[k] = v; S.guard = false; } S.noKeep = true; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, rid = a.dataset.r, k = a.dataset.k, tabBefore = S.sheetTab;
  switch (act) {
    case 'card': cardClick(rid, k); break;
    case 'dvar': doDraft(rid, k, a.dataset.f, a.dataset.v); break;
    case 'pvar': doVar(rid, +a.dataset.i, a.dataset.f, a.dataset.v); break;
    case 'rmidx': doRemoveIdx(rid, +a.dataset.i); break;
    case 'unpick': doUnpick(rid, k); break;
    case 'remove': doRemove(rid, k); break;
    case 'decline': doDecline(rid); break;
    case 'undo': doUndo(rid); break;
    case 'pq': doQty(k, +a.dataset.d); break;
    case 'gplus': groupOp(rid, k, a.dataset.g, 'plus'); break;
    case 'gminus': groupOp(rid, k, a.dataset.g, 'minus'); break;
    case 'gfill': groupOp(rid, k, a.dataset.g, 'fill'); break;
    case 'gvar': return;
    case 'cvar': compOp(rid, k, 'var', a); break;
    case 'cqty': compOp(rid, k, 'qty', a); break;
    case 'cadd': compOp(rid, k, 'add', a); break;
    case 'gedit': { const [size, color] = a.dataset.g.split('|'); const n = picks(RULE[rid]).filter(p => p.sku === k && (p.size||'') + '|' + (p.color||'') === a.dataset.g).length;
      S.edit = {key:rid + '|' + k, g:a.dataset.g}; S.comp[rid + '|' + k] = {size:size || undefined, color:color || undefined, n}; break; }
    case 'gdel': { const g = a.dataset.g; S.sel[rid] = picks(RULE[rid]).filter(p => !(p.sku === k && (p.size||'') + '|' + (p.color||'') === g)); if (S.edit && S.edit.g === g) S.edit = null; break; }
    case 'gcancel': if (S.edit) delete S.comp[S.edit.key]; S.edit = null; break;
    case 'slot': S.active = activeSlot() === rid ? '' : rid; S.full = null; S.hint = null; if (isMob() && S.active) S.scrollTo = rid; break;
    case 'jump': focusPending(rid && pending(RULE[rid]) ? rid : null); if (rid && !pending(RULE[rid])) { S.active = rid; S.scrollTo = rid; } break;
    case 'code': {
      S.codeInput = ((document.getElementById('codeIn') || {}).value || '').trim();
      if (S.codeInput.toUpperCase() === 'PINK') { S.code = true; S.codeMsg = ''; initSel('code'); delete S.dec.code; S.newSlot = 'code'; if (S.platform === 'app') S.scrollTo = 'agc'; else focusPending('code'); }
      else S.codeMsg = 'err'; break;
    }
    case 'uncode': S.code = false; S.codeInput = ''; initSel('code'); delete S.dec.code; if (S.active === 'code') S.active = null; break;
    case 'next':
      if (S.step === 'cart') { if (pendList().length && !S.guard) { S.guard = true; focusPending(); break; } S.step = 'ship'; S.guard = false; }
      else if (S.step === 'ship') S.step = 'pay'; else if (S.step === 'pay') S.step = 'done';
      window.scrollTo({top:0}); break;
    case 'go': S.step = a.dataset.s; S.guard = false; break;
    case 'tocart': S.step = 'cart'; focusPending(); break;
    case 'ship': S.ship = k; break;
    case 'pay': S.pay = k; break;
    case 'asheet': openSheet(rid); S.sameTab = false; break;
    case 'atab': S.sheetTab = rid; S.full = null; S.hint = null; break;
    case 'anext': { const nx = pendList()[0]; if (nx) S.sheetTab = nx.id; break; }
    case 'aclose': S.sheet = false; S.sheetGuard = false; S.full = null; S.hint = null; break;
    case 'acheckout': if (toGet() && !S.guardShown) { S.guardShown = true; openSheet(null, true); } else { S.appStep = 'checkout'; S.sheet = false; } break;
    case 'askip': S.sheet = false; S.sheetGuard = false; S.appStep = 'checkout'; break;
    case 'aback': S.appStep = 'cart'; break;
    case 'atocart': S.appStep = 'cart'; openSheet(null); break;
    case 'aorder': S.appStep = 'done'; break;
    case 'acode': S.codeOpen = true; break;
    case 'restart': resetFlow(); break;
    default: return;
  }
  if (S.sheetTab !== tabBefore) S.sameTab = false;
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'codeIn' && e.key === 'Enter') document.querySelector('[data-act="code"]').click();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act="card"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-act="gvar"]'); if (!sel) return;
  groupOp(sel.dataset.r, sel.dataset.k, sel.dataset.g, 'var', sel.dataset.f, sel.value); render();
});
document.addEventListener('input', e => { if (e.target.id === 'codeIn') S.codeInput = e.target.value; });
render();
})();

</script>
</body>
</html>
